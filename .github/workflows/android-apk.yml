
name: Build JOKER OFFICIAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: archive
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "No project ZIP found!"
            exit 1
          fi
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/joker-project"
          unzip -q "${{ steps.archive.outputs.path }}" -d "$RUNNER_TEMP/joker-project"
          test -f "$RUNNER_TEMP/joker-project/app/build.gradle.kts"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build APK
        working-directory: ${{ runner.temp }}/joker-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOKER-OFFICIAL-APK
          path: ${{ runner.temp }}/joker-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
